<svg class="arch" viewBox="0 0 1240 600" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">Cadabra architecture</title>
  <desc id="arch-desc">Phones load the controller site from S3 and CloudFront and join rooms over an API Gateway WebSocket. The Fire TV Stick runs the game and talks to phones directly over a WebRTC DataChannel. In AWS ap-south-1, the WsFn Lambda handles rooms, signaling and relay and stores state in DynamoDB. It invokes ForgeFn, the AI designer, and HostFn, the captions writer. Both call Amazon Bedrock and Bedrock Guardrails. ForgeFn reads the Anthropic API fallback key from Secrets Manager and falls back to the Anthropic API while Bedrock quota is zero.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="a-head"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="a-head-c"/></marker>
  </defs>

  <!-- AWS region -->
  <rect x="300" y="20" width="740" height="520" rx="22" class="a-region"/>
  <text x="324" y="50" class="a-region-label">AWS ap-south-1, one CDK stack</text>

  <!-- edges (drawn first, under boxes) -->
  <g class="a-edges">
    <path d="M220 92 L330 92" marker-end="url(#ah)"/>
    <text x="246" y="84" class="a-lbl">HTTPS</text>
    <path d="M220 130 C 270 130, 280 236, 330 236" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="258" y="170" class="a-lbl">WSS</text>
    <path d="M220 340 C 270 340, 280 262, 330 262" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="258" y="318" class="a-lbl">WSS</text>
    <path d="M520 249 L570 249" marker-end="url(#ah)"/>
    <path d="M760 249 L810 249" marker-end="url(#ah)"/>
    <path d="M665 284 L665 330" marker-end="url(#ah)"/>
    <text x="674" y="312" class="a-lbl">async</text>
    <path d="M590 284 L590 296 L552 312 L552 462 L570 462" marker-end="url(#ah)"/>
    <text x="494" y="392" class="a-lbl">async</text>
    <path d="M760 352 L810 352" marker-end="url(#ah)"/>
    <path d="M760 378 C 785 378, 790 452, 810 452" marker-end="url(#ah)"/>
    <path d="M760 452 C 785 452, 790 388, 810 386" marker-end="url(#ah)"/>
    <path d="M760 476 L810 476" marker-end="url(#ah)"/>
    <path d="M740 330 C 760 300, 820 300, 860 284" marker-end="url(#ah)"/>
    <path class="a-dash" d="M520 416 C 545 416, 545 372, 570 372" marker-end="url(#ah)"/>
    <path class="a-dash" d="M1000 366 L1070 366" marker-end="url(#ah)"/>
    <text x="1048" y="414" class="a-lbl">fallback while</text>
    <text x="1048" y="431" class="a-lbl">Bedrock quota is 0</text>
  </g>
  <path class="a-rtc" d="M120 150 L120 300" marker-start="url(#ahc)" marker-end="url(#ahc)"/>
  <text x="134" y="214" class="a-lbl a-lbl-c">WebRTC</text>
  <text x="134" y="232" class="a-lbl a-lbl-c">DataChannel</text>
  <text x="134" y="250" class="a-lbl">13 to 16 ms</text>

  <!-- clients -->
  <g class="a-node a-client">
    <rect x="20" y="60" width="200" height="90" rx="14"/>
    <text x="40" y="94" class="a-t">Phones</text>
    <text x="40" y="118" class="a-s">controller web app</text>
    <text x="40" y="136" class="a-s">browser, no install</text>
  </g>
  <g class="a-node a-tv">
    <rect x="20" y="300" width="200" height="130" rx="14"/>
    <text x="40" y="334" class="a-t">Fire TV Stick HD</text>
    <text x="40" y="358" class="a-s">Kotlin shell + WebView</text>
    <text x="40" y="376" class="a-s">engine, 9 blocks, bots</text>
    <text x="40" y="394" class="a-s">planck physics, PixiJS</text>
    <text x="40" y="414" class="a-s a-s-c">authoritative host</text>
  </g>

  <!-- aws column A -->
  <g class="a-node"><rect x="330" y="62" width="190" height="64" rx="12"/><text x="348" y="90" class="a-t">S3 + CloudFront</text><text x="348" y="110" class="a-s">controller site, assets</text></g>
  <g class="a-node"><rect x="330" y="214" width="190" height="70" rx="12"/><text x="348" y="243" class="a-t">API Gateway</text><text x="348" y="264" class="a-s">WebSocket rooms</text></g>
  <g class="a-node"><rect x="330" y="384" width="190" height="64" rx="12"/><text x="348" y="412" class="a-t">Secrets Manager</text><text x="348" y="432" class="a-s">fallback API key</text></g>

  <!-- aws column B -->
  <g class="a-node a-fn"><rect x="570" y="214" width="190" height="70" rx="12"/><text x="588" y="243" class="a-t">Lambda WsFn</text><text x="588" y="264" class="a-s">rooms, signaling, relay</text></g>
  <g class="a-node a-fn a-hot"><rect x="570" y="330" width="190" height="70" rx="12"/><text x="588" y="359" class="a-t">Lambda ForgeFn</text><text x="588" y="380" class="a-s">AI designer, tweak, playtest</text></g>
  <g class="a-node a-fn"><rect x="570" y="430" width="190" height="70" rx="12"/><text x="588" y="459" class="a-t">Lambda HostFn</text><text x="588" y="480" class="a-s">captions, roast</text></g>

  <!-- aws column C -->
  <g class="a-node"><rect x="810" y="214" width="190" height="70" rx="12"/><text x="828" y="243" class="a-t">DynamoDB</text><text x="828" y="264" class="a-s">one table + TTL</text></g>
  <g class="a-node a-ai"><rect x="810" y="330" width="190" height="70" rx="12"/><text x="828" y="359" class="a-t">Amazon Bedrock</text><text x="828" y="380" class="a-s">Converse, tool use</text></g>
  <g class="a-node a-ai"><rect x="810" y="430" width="190" height="70" rx="12"/><text x="828" y="459" class="a-t">Guardrails</text><text x="828" y="480" class="a-s">cadabra-family-safe</text></g>

  <!-- outside -->
  <g class="a-node a-ext"><rect x="1070" y="330" width="150" height="70" rx="12"/><text x="1086" y="359" class="a-t">Anthropic API</text><text x="1086" y="380" class="a-s">Claude 5.5 models</text></g>
</svg>
